<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LunaGalaxie a.k.a. GypsieLuna — Neuro-Exo</title>
<meta name="description" content="Transmission entrante. LunaGalaxie, dite GypsieLuna : porte-parole du projet, à bord du GhostSheller." />
<link rel="stylesheet" href="style.css" />
<style>
  /* Cette page est volontairement la plus nue du site : une transmission,
     pas une fiche produit. Pas de cartes, pas de listes, pas de boutons. */
  .transmission {
    min-height: 100vh; display: flex; flex-direction: column; justify-content: center;
    padding: 3rem 1.5rem 4rem; position: relative; z-index: 10;
  }
  .entete-tx {
    max-width: 60rem; margin: 0 auto; width: 100%;
    display: flex; align-items: center; justify-content: space-between;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: .72rem; letter-spacing: .18em; text-transform: uppercase;
    color: rgba(46,16,101,.55);
  }
  .entete-tx a { color: inherit; text-decoration: none; }
  .entete-tx a:hover { color: var(--magenta); }
  .signal { display: inline-flex; align-items: center; gap: .5rem; color: #a21caf; }
  .signal .point { background: #ec4899; }

  .tx-corps { max-width: 60rem; margin: 0 auto; width: 100%; text-align: center; padding-top: 3rem; }

  .tx-nom {
    font-size: clamp(2.4rem, 7vw, 5rem); font-weight: 900; letter-spacing: -.04em;
    line-height: .95; margin: 0; color: var(--cosmos);
  }
  .tx-alias {
    display: block; margin-top: .5rem; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: clamp(.8rem, 2vw, 1rem); letter-spacing: .32em; text-transform: uppercase;
    color: #c026d3; font-weight: 600;
  }
  .tx-texte {
    max-width: 34rem; margin: 2rem auto 0; font-size: 1.02rem; line-height: 1.8;
    color: rgba(46,16,101,.78);
  }
  .tx-texte strong { color: var(--cosmos); }

  .vaisseau {
    margin: 3rem auto 0; max-width: 62rem; position: relative;
    border-radius: 1.6rem; overflow: hidden;
    border: 1px solid rgba(255,255,255,.7);
    box-shadow: 0 30px 90px rgba(139,92,246,.35), 0 0 0 1px rgba(196,181,253,.6) inset;
  }
  .vaisseau img { display: block; width: 100%; height: auto; }
  .vaisseau::after {
    /* voile violet léger : l'image appartient à la page, elle n'est pas posée dessus */
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(180deg, rgba(139,92,246,.10), rgba(236,72,153,.10));
    mix-blend-mode: screen;
  }
  .legende-vaisseau {
    margin: 1rem 0 0; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: .7rem; letter-spacing: .16em; text-transform: uppercase;
    color: rgba(46,16,101,.55); text-align: center;
  }
  .tx-pied {
    margin-top: 3rem; text-align: center; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: .68rem; letter-spacing: .18em; text-transform: uppercase;
    color: rgba(46,16,101,.45);
  }
</style>
</head>
<body>

<div class="blob blob-a"></div>
<div class="blob blob-b"></div>

<main class="transmission">

  <div class="entete-tx">
    <a href="index.html">← Retour</a>
    <span class="signal"><span class="point"></span>Transmission entrante</span>
  </div>

  <div class="tx-corps">
    <h1 class="tx-nom">
      LunaGalaxie
      <span class="tx-alias">a.k.a. GypsieLuna</span>
    </h1>

    <p class="tx-texte">
      Porte-parole et narratrice du projet. Elle voyage à bord du
      <strong>GhostSheller</strong>, vaisseau quantique millénaire à propulsion
      <em>black-hole</em>, entourée de son fidèle équipage.
    </p>

    <figure style="margin:0">
      <div class="vaisseau">
        <img src="assets/ghostsheller.jpg" alt="Le GhostSheller, vaisseau quantique millénaire, en orbite au-dessus d'une planète bleue" width="1140" height="641" loading="lazy" />
      </div>
      <figcaption class="legende-vaisseau">GhostSheller — propulsion black-hole</figcaption>
    </figure>

    <p class="tx-pied">Signal incomplet · page en construction</p>
  </div>

</main>

</body>
</html>
